[project]
name = "terrasync"
version = "0.1.0"
description = "Download geographic data from public GeoServer sources"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "geopandas>=0.14",
    "pandas>=2.2",
    "tenacity>=8.3",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-postgres>=1.8",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fiona>=1.9",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "httpx>=0.27",
]

[project.scripts]
terrasync = "terrasync.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/terrasync"]

[tool.uv]
dev-dependencies = [
    "folium>=0.17",
    "jupyter>=1.0",
]
