[project]
name = "terrasync"
version = "0.1.0"
description = "Download geographic data from public GeoServer sources"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "geopandas>=0.14",
    "fiona>=1.9",
    "pandas>=2.2",
    "tenacity>=8.3",
]

[project.scripts]
terrasync = "terrasync.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
