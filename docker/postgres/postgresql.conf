# tuning para workstation rodando piloto canonical_sicar (SP+SE)
# ajustar shared_buffers/effective_cache_size conforme RAM da maquina

listen_addresses = '*'
max_connections = 50

shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 512MB
maintenance_work_mem = 2GB

max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_worker_processes = 8

random_page_cost = 1.1
effective_io_concurrency = 200

checkpoint_timeout = 30min
max_wal_size = 8GB
min_wal_size = 1GB

log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
