services:
  postgres:
    build:
      context: ./docker/postgres
      args:
        PG_PARQUET_VERSION: "0.3.0"
    image: terrasync/postgis-pgparquet:16-3.5
    container_name: terrasync-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE:-terrasync}
      POSTGRES_USER: ${PGUSER:-terrasync}
      POSTGRES_PASSWORD: ${PGPASSWORD:-terrasync}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/staging:/data/staging:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-terrasync} -d ${PGDATABASE:-terrasync}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
    name: terrasync-pgdata
