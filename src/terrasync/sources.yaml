# terrasync — Source catalog
# Declarative definition of all data sources.
# Consumed by config.py (pydantic loader).

groups:
  incra:
    name: "INCRA - Acervo Fundiário"
    description: >-
      Dados fundiários do Instituto Nacional de Colonização
      e Reforma Agrária
    sources:
      - incra_quilombolas
      - incra_sigef_privado
      - incra_sigef_publico
      - incra_snci_privado
      - incra_snci_publico
      - incra_assentamentos

  prodes:
    name: "PRODES - Desmatamento Anual"
    description: "Monitoramento do desmatamento por corte raso (INPE)"
    sources:
      - prodes_amazonia
      - prodes_cerrado
      - prodes_caatinga
      - prodes_mata_atlantica
      - prodes_pantanal
      - prodes_pampa

  deter:
    name: "DETER - Alertas de Desmatamento"
    description: "Sistema de detecção em tempo real de desmatamento (INPE)"
    sources:
      - deter_amazonia
      - deter_cerrado

  ana:
    name: "ANA - Agência Nacional de Águas"
    description: "Dados hídricos e de irrigação"
    sources:
      - ana

  sfb:
    name: "SFB - Serviço Florestal Brasileiro"
    description: "Cadastro Nacional de Florestas Públicas e concessões"
    sources:
      - sfb

  ibge:
    name: "IBGE - Malhas Territoriais"
    description: "Malhas digitais oficiais (municípios, UFs, etc.)"
    sources:
      - ibge_municipios

# ---------------------------------------------------------------------------
# WFS Sources
# ---------------------------------------------------------------------------

sources:
  sicar:
    type: wfs
    display_name: "SICAR - CAR"
    description: "Cadastro Ambiental Rural por UF"
    category: land_use
    base_url: "https://geoserver.car.gov.br/geoserver/sicar/ows"
    layer_template: "sicar:sicar_imoveis_{layer}"
    layers:
      - id: ac
      - id: al
      - id: am
      - id: ap
      - id: ba
      - id: ce
      - id: df
      - id: es
      - id: go
      - id: ma
      - id: mg
      - id: ms
      - id: mt
      - id: pa
      - id: pb
      - id: pe
      - id: pi
      - id: pr
      - id: rj
      - id: rn
      - id: ro
      - id: rr
      - id: rs
      - id: sc
      - id: se
      - id: sp
      - id: to
    wfs_version: "2.0.0"
    page_size: 10000
    max_concurrent: 3
    epsg: 4674
    geometry_type: MultiPolygon

  funai:
    type: wfs
    display_name: "FUNAI - Terras Indígenas"
    description: "Terras indígenas demarcadas (polígonos)"
    category: boundaries
    base_url: "https://geoserver.funai.gov.br/geoserver/Funai/ows"
    layer_template: "Funai:{layer}"
    layers:
      - id: tis_poligonais
        name: "Terras Indígenas"
        geometry_type: MultiPolygon
    wfs_version: "2.0.0"
    page_size: 10000
    max_concurrent: 3
    epsg: 4674
    sort_by: gid
    geometry_type: MultiPolygon

  incra_quilombolas:
    type: wfs
    display_name: "INCRA - Quilombolas"
    description: "Áreas quilombolas reconhecidas"
    category: boundaries
    group: incra
    base_url: "https://cmr.funai.gov.br/geoserver/ows"
    layer_template: "CMR-PUBLICO:{layer}"
    layers:
      - id: lim_quilombolas_a
        name: "Áreas Quilombolas"
        geometry_type: MultiPolygon
    wfs_version: "1.0.0"
    page_size: 10000
    max_concurrent: 1
    epsg: 4674
    geometry_type: MultiPolygon

  incra_sigef_privado:
    type: zip_shapefile
    display_name: "INCRA - SIGEF Privado"
    description: "Imóveis rurais certificados (privados) via SIGEF"
    category: land_use
    group: incra
    epsg: 4674
    url: "http://certificacao.incra.gov.br/csv_shp/zip/Sigef%20Privado.zip"

  incra_sigef_publico:
    type: zip_shapefile
    display_name: "INCRA - SIGEF Público"
    description: "Imóveis rurais certificados (públicos) via SIGEF"
    category: land_use
    group: incra
    epsg: 4674
    url: "http://certificacao.incra.gov.br/csv_shp/zip/Sigef%20P%C3%BAblico.zip"

  incra_snci_privado:
    type: zip_shapefile
    display_name: "INCRA - SNCI Privado"
    description: "Imóveis certificados SNCI (privados)"
    category: land_use
    group: incra
    epsg: 4674
    url: "http://certificacao.incra.gov.br/csv_shp/zip/Im%C3%B3vel%20certificado%20SNCI%20Privado.zip"

  incra_snci_publico:
    type: zip_shapefile
    display_name: "INCRA - SNCI Público"
    description: "Imóveis certificados SNCI (públicos)"
    category: land_use
    group: incra
    epsg: 4674
    url: "http://certificacao.incra.gov.br/csv_shp/zip/Im%C3%B3vel%20certificado%20SNCI%20P%C3%BAblico.zip"

  incra_assentamentos:
    type: zip_shapefile
    display_name: "INCRA - Assentamentos"
    description: "Assentamentos da reforma agrária"
    category: boundaries
    group: incra
    epsg: 4674
    url: "http://certificacao.incra.gov.br/csv_shp/zip/Assentamento%20Brasil.zip"

  ibge_municipios:
    type: zip_shapefile
    display_name: "IBGE - Municípios 2025"
    description: "Malha digital municipal (BR_Municipios_2025) — base para outline de UFs e canonical_municipios futuro"
    category: boundaries
    group: ibge
    epsg: 4674
    url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2025/Brasil/BR_Municipios_2025.zip"

  icmbio:
    type: wfs
    display_name: "ICMBio - Unidades de Conservação"
    description: "Limites das unidades de conservação federais"
    category: environmental
    base_url: "https://geoservicos.inde.gov.br/geoserver/ICMBio/ows"
    layer_template: "ICMBio:{layer}"
    layers:
      - id: limiteucsfederais_a
        name: "UCs Federais"
        geometry_type: MultiPolygon
    wfs_version: "1.1.0"
    page_size: 100000
    max_concurrent: 1
    epsg: 4674
    geometry_type: MultiPolygon

  ibama:
    type: wfs
    display_name: "IBAMA - Embargos"
    description: "Áreas embargadas por infração ambiental"
    category: environmental
    base_url: "https://siscom.ibama.gov.br/geoserver/wfs"
