  # -------------------------------------------------------------------------
  # ArcGIS REST Sources
  # -------------------------------------------------------------------------

  ana:
    type: arcgis
    display_name: "ANA - Águas"
    description: "Dados da Agência Nacional de Águas e Saneamento Básico"
    category: environmental
    group: ana
    base_url: "https://portal1.snirh.gov.br/server/rest/services/dados_abertos"
    layers:
      - id: hidrografia
        name: "Hidrografia"
        service_path: "Hidrografia/FeatureServer/0"
        geometry_type: MultiLineString
      - id: pivos_irrigacao
        name: "Pivôs de Irrigação"
        service_path: "Pivos_Mapeados/FeatureServer/0"
        geometry_type: MultiPolygon
      - id: demanda_irrigacao
        name: "Demanda de Irrigação"
        service_path: "Demanda_de_Irrigacao_Vazao_de_Retirada_para_Irrigacao/FeatureServer/0"
        geometry_type: Point
      - id: disponibilidade_hidrica
        name: "Disponibilidade Hídrica"
        service_path: "Disponibilidade_Hidrica_Superficial/FeatureServer/0"
        geometry_type: Point
    max_record_count: 1000
    max_concurrent: 2
    epsg: 4674

  sfb:
    type: arcgis
    display_name: "SFB - Florestas Públicas"
    description: >-
      Cadastro Nacional de Florestas Públicas e concessões
      florestais
    category: environmental
    group: sfb
    base_url: "https://mapas.florestal.gov.br/server/rest/services"
    layers:
      - id: cnfp
        name: "Cadastro Nacional de Florestas Públicas"
        service_path: "Hosted/CNFP_v19_03_retificado_17072025/FeatureServer/9"
        geometry_type: MultiPolygon
      - id: concessoes
        name: "Concessões Florestais"
        service_path: "Hosted/unidades_concessoes_florestais/FeatureServer/0"
        geometry_type: MultiPolygon
      - id: ifn_conglomerados
        name: "IFN - Conglomerados"
        service_path: "DadosAbertos-IFN/Conglomerado/FeatureServer/0"
        geometry_type: Point
    max_record_count: 2000
    max_concurrent: 2
    epsg: 4674
