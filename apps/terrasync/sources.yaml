# terrasync — Source catalog
# providers: metadados institucionais (não afetam a lógica de ingestão)
# sources: lista flat de connectors com overrides por layer

providers:
  inpe:
    display_name: "INPE - Instituto Nacional de Pesquisas Espaciais"
  incra:
    display_name: "INCRA - Instituto Nacional de Colonização e Reforma Agrária"
  ibge:
    display_name: "IBGE - Instituto Brasileiro de Geografia e Estatística"
  sfb:
    display_name: "SFB - Serviço Florestal Brasileiro"
  sicar:
    display_name: "SICAR - Sistema Nacional de Cadastro Ambiental Rural"
  funai:
    display_name: "FUNAI - Fundação Nacional dos Povos Indígenas"
  mma:
    display_name: "MMA - Ministério do Meio Ambiente"
  anm:
    display_name: "ANM - Agência Nacional de Mineração"

# ---------------------------------------------------------------------------
# Sources (connectors)
# ---------------------------------------------------------------------------

sources:

  # --- INPE ---

  prodes:
    type: wfs
    display_name: "PRODES - Desmatamento Anual"
    description: "Monitoramento do desmatamento por corte raso (INPE)"
    category: deforestation
    provider: inpe
    temporal: true
    cadence: yearly
    wfs_version: "1.0.0"
    page_size: 50000
    max_concurrent: 1
    epsg: 4674
    sort_by: uid
    geometry_type: MultiPolygon
    layers:
      - id: amazonia
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/prodes-amazon-nb/ows"
        layer_template: "prodes-amazon-nb:yearly_deforestation_biome"
      - id: cerrado
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/prodes-cerrado-nb/ows"
        layer_template: "prodes-cerrado-nb:yearly_deforestation"
      - id: caatinga
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/prodes-caatinga-nb/ows"
        layer_template: "prodes-caatinga-nb:yearly_deforestation"
      - id: mata_atlantica
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/prodes-mata-atlantica-nb/ows"
        layer_template: "prodes-mata-atlantica-nb:yearly_deforestation"
      - id: pantanal
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/prodes-pantanal-nb/ows"
        layer_template: "prodes-pantanal-nb:yearly_deforestation"
      - id: pampa
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/prodes-pampa-nb/ows"
        layer_template: "prodes-pampa-nb:yearly_deforestation"

  deter:
    type: wfs
    display_name: "DETER - Alertas de Desmatamento"
    description: "Sistema de detecção em tempo real de desmatamento (INPE)"
    category: deforestation
    provider: inpe
    temporal: true
    cadence: daily
    wfs_version: "1.0.0"
    page_size: 100000
    max_concurrent: 1
    epsg: 4674
    sort_by: view_date
    geometry_type: MultiPolygon
    layers:
      - id: amazonia
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/deter-amz/ows"
        layer_template: "deter-amz:deter_amz"
      - id: cerrado
        base_url: "https://terrabrasilis.dpi.inpe.br/geoserver/deter-cerrado-nb/ows"
        layer_template: "deter-cerrado-nb:deter_cerrado"

  # --- INCRA ---

  incra_sigef:
    type: zip_shapefile
    display_name: "INCRA - SIGEF"
    description: "Imóveis rurais certificados via SIGEF (privados + públicos)"
    category: land_tenure
    provider: incra
    cadence: weekly
    epsg: 4674
    layers:
      - id: privado
        url: "http://certificacao.incra.gov.br/csv_shp/zip/Sigef%20Privado.zip"
      - id: publico
        url: "http://certificacao.incra.gov.br/csv_shp/zip/Sigef%20P%C3%BAblico.zip"

  incra_snci:
    type: zip_shapefile
    display_name: "INCRA - SNCI"
    description: "Imóveis certificados SNCI (privados + públicos)"
    category: land_tenure
    provider: incra
    cadence: yearly
    epsg: 4674
    layers:
      - id: privado
        url: "http://certificacao.incra.gov.br/csv_shp/zip/Im%C3%B3vel%20certificado%20SNCI%20Privado.zip"
      - id: publico
        url: "http://certificacao.incra.gov.br/csv_shp/zip/Im%C3%B3vel%20certificado%20SNCI%20P%C3%BAblico.zip"

  incra_assentamentos:
    type: zip_shapefile
    display_name: "INCRA - Assentamentos"
    description: "Assentamentos da reforma agrária"
    category: land_tenure
    provider: incra
    cadence: yearly
    epsg: 4674
    layers:
      - id: brasil
        url: "http://certificacao.incra.gov.br/csv_shp/zip/Assentamento%20Brasil.zip"

  incra_quilombolas:
    type: wfs
    display_name: "INCRA - Quilombolas"
    description: "Áreas quilombolas reconhecidas"
    category: land_tenure
    provider: incra
    cadence: yearly
    base_url: "https://cmr.funai.gov.br/geoserver/ows"
    layer_template: "CMR-PUBLICO:{layer}"
    wfs_version: "1.0.0"
    page_size: 10000
    max_concurrent: 1
    epsg: 4674
    geometry_type: MultiPolygon
    layers:
      - id: lim_quilombolas_a
        name: "Áreas Quilombolas"

  # --- SICAR ---

  sicar:
    type: wfs
    display_name: "SICAR - CAR"
    description: "Cadastro Ambiental Rural por UF"
    category: land_tenure
    provider: sicar
    cadence: daily
    base_url: "https://geoserver.car.gov.br/geoserver/sicar/ows"
    layer_template: "sicar:sicar_imoveis_{layer}"
    wfs_version: "2.0.0"
    page_size: 10000
    max_concurrent: 3
    epsg: 4674
    geometry_type: MultiPolygon
    layers:
      - id: ac
      - id: al
      - id: am
      - id: ap
      - id: ba
      - id: ce
      - id: df
      - id: es
      - id: go
      - id: ma
      - id: mg
      - id: ms
      - id: mt
      - id: pa
      - id: pb
      - id: pe
      - id: pi
      - id: pr
      - id: rj
      - id: rn
      - id: ro
      - id: rr
      - id: rs
      - id: sc
      - id: se
      - id: sp
      - id: to

  # --- SFB ---

  sfb:
    type: arcgis
    display_name: "SFB - Florestas Públicas"
    description: "Cadastro Nacional de Florestas Públicas e concessões florestais"
    category: land_tenure
    provider: sfb
    cadence: quarterly
    base_url: "https://mapas.florestal.gov.br/server/rest/services"
    max_record_count: 2000
    max_concurrent: 2
    epsg: 4674
    layers:
      - id: cnfp
        name: "Cadastro Nacional de Florestas Públicas"
        service_path: "Hosted/CNFP_v19_03_retificado_17072025/FeatureServer/9"
        geometry_type: MultiPolygon

  # --- IBGE ---

  ibge:
    type: zip_shapefile
    display_name: "IBGE - Municípios 2025"
    description: "Malha digital municipal (BR_Municipios_2025) — base para outline de UFs e canonical_municipios futuro"
    category: boundaries
    provider: ibge
    cadence: yearly
    epsg: 4674
    layers:
      - id: municipios
        url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2025/Brasil/BR_Municipios_2025.zip"

  # --- FUNAI ---

  funai:
    type: wfs
    display_name: "FUNAI - Terras Indígenas"
    description: "Terras indígenas demarcadas (polígonos)"
    category: boundaries
    provider: funai
    cadence: quarterly
    base_url: "https://geoserver.funai.gov.br/geoserver/Funai/ows"
    layer_template: "Funai:{layer}"
    wfs_version: "2.0.0"
    page_size: 10000
    max_concurrent: 3
    epsg: 4674
    sort_by: gid
    geometry_type: MultiPolygon
    layers:
      - id: tis_poligonais
        name: "Terras Indígenas"

  # --- ANM ---

  sigmine:
    type: zip_shapefile
    display_name: "ANM - SIGMINE (Processos Minerários)"
    description: "Polígonos dos processos minerários ativos (incluindo áreas em disponibilidade) mantidos pela ANM."
    category: mining
    provider: anm
    cadence: daily
    epsg: 4674
    encoding: UTF-8
    layers:
      - id: brasil
        url: "https://dadosabertos.anm.gov.br/SIGMINE/PROCESSOS_MINERARIOS/BRASIL.zip"

  # --- MMA ---

  mma:
    type: zip_shapefile
    display_name: "MMA - CNUC (Unidades de Conservação)"
    description: >-
      Cadastro Nacional de Unidades de Conservação — federais, estaduais
      e municipais. Fonte manual: baixar o ZIP mais recente do dados.gov.br
      e colocar em data/cache/ preservando o nome original
      (ex.: mma_cnuc_2026_03.zip).
    category: land_tenure
    provider: mma
    cadence: quarterly
    epsg: 4674
    manual: true
    encoding: ISO-8859-1
    layers:
      - id: cnuc
        url: "https://dados.gov.br/dados/conjuntos-dados/unidadesdeconservacao"
