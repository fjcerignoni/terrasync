name: 'terrasync'
version: '1.0.0'

profile: 'terrasync'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  data_root: "../../data"

models:
  terrasync:
    bronze:
      +materialized: external
    silver:
      +materialized: external
      canonical:
        +materialized: table
        +schema: silver
        +contract:
          enforced: true
    exports:
      +materialized: external
