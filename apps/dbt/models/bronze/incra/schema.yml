version: 2
models:
  - name: bro_incra_sigef_privado
    description: >-
      Bronze INCRA SIGEF privado. Dedup por parcela_co, keep
      mais recente por data_aprov.
    config:
      tags: ['bronze']
    columns:
      - name: stg_id
        data_type: VARCHAR
        description: "Surrogate key MD5 de parcela_co."
        tests:
          - not_null
          - unique
      - name: parcela_co
        data_type: VARCHAR
        description: "Código da parcela certificada SIGEF (PK da fonte)."
        tests:
          - not_null
          - unique
      - name: tipo
        data_type: VARCHAR
        description: "Regime fundiário: 'privado'."
        tests:
          - not_null
      - name: geometry
        data_type: geometry
        description: "MULTIPOLYGON EPSG:4326 — saida do clean_geometry."
        tests:
          - not_null
