          - unique
      - name: uuid
        data_type: VARCHAR
        description: "Surrogate key gerado de uid via dbt_utils."
        tests:
          - not_null
          - unique
      - name: biome
        data_type: VARCHAR
        description: "Bioma: 'cerrado'."
        tests:
          - not_null
      - name: geometry
