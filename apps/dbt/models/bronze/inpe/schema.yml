version: 2
models:
  - name: bro_prodes_amazonia
    description: >-
      Bronze PRODES amazonia — clean_geometry(rawdata, 4674->4326).
      Dedup por uuid, keep mais recente por image_date.
    config:
      tags: ['bronze']
    columns:
      - name: stg_id
        data_type: VARCHAR
        description: "Surrogate key MD5 de uuid."
        tests:
          - not_null
          - unique
      - name: uuid
        data_type: VARCHAR
        description: "Identificador único do polígono PRODES (PK da fonte)."
        tests:
          - not_null
          - unique
      - name: biome
        data_type: VARCHAR
        description: "Bioma: 'amazonia'."
        tests:
          - not_null
      - name: geometry
        data_type: geometry
        description: "MULTIPOLYGON EPSG:4326 — saida do clean_geometry."
        tests:
          - not_null
  - name: bro_prodes_cerrado
    description: >-
      Bronze PRODES cerrado — clean_geometry(rawdata, 4674->4326).
