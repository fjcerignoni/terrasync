version: 2
models:
  - name: bro_sicar_ac
    description: >-
      Bronze SICAR AC. Dedup por cod_imovel, keep mais recente por dat_criacao.
    config:
      tags: ['bronze']
    columns:
      - name: stg_id
        data_type: VARCHAR
        description: "Surrogate key MD5 de cod_imovel."
        tests:
          - not_null
          - unique
      - name: cod_imovel
        data_type: VARCHAR
        description: "Codigo do imovel rural no CAR (PK da fonte SICAR)."
        tests:
          - not_null
          - unique
      - name: geometry
        data_type: geometry
        description: "MULTIPOLYGON EPSG:4326 — saida do clean_geometry."
        tests:
          - not_null
