version: 2
models:
  - name: stg_prodes
    description: >-
      Staging PRODES — desmatamento anual unificado (6 biomas). biome derivado
      do filename. scene_id normalizado para DOUBLE (pampa usa BIGINT na fonte).
      Geometrias MULTIPOLYGON em EPSG:4326.
    columns:
      - name: biome
        data_type: VARCHAR
        description: Bioma (amazonia, cerrado, caatinga, mata_atlantica, pantanal, pampa).
        tests:
          - not_null
      - name: geometry
        data_type: GEOMETRY
        description: MULTIPOLYGON EPSG:4326.
        tests:
          - not_null

  - name: stg_deter
    description: >-
      Staging DETER unificado — alertas de desmatamento em tempo real (Amazônia + Cerrado).
      biome identifica a origem ('amazonia' ou 'cerrado'). UNION ALL BY NAME alinha schema
      divergente entre as duas fontes. Geometrias MULTIPOLYGON em EPSG:4326.
    columns:
      - name: biome
        data_type: VARCHAR
        description: Bioma de origem do alerta ('amazonia' ou 'cerrado').
        tests:
          - not_null
          - accepted_values:
              values: ['amazonia', 'cerrado']
      - name: geometry
        data_type: GEOMETRY
        description: MULTIPOLYGON EPSG:4326.
        tests:
          - not_null
