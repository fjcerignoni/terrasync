version: 2
models:
  - name: stg_nasa_firms
    description: >-
      Staging NASA FIRMS VIIRS NOAA-20 — focos de calor 375m, Brasil,
      a partir de 2026-01-01. Geometrias POINT em EPSG:4326.
    columns:
      - name: latitude
        data_type: DOUBLE
        description: Latitude do centroide do pixel de detecção.
      - name: longitude
        data_type: DOUBLE
        description: Longitude do centroide do pixel de detecção.
      - name: acq_date
        data_type: DATE
        description: Data de aquisição UTC.
        tests:
          - not_null
      - name: acq_time
        data_type: VARCHAR
        description: Hora de aquisição UTC (HHMM).
      - name: satellite
        data_type: VARCHAR
        description: "Satélite (ex.: N20)."
      - name: instrument
        data_type: VARCHAR
        description: "Instrumento sensor (ex.: VIIRS)."
      - name: confidence
        data_type: VARCHAR
        description: Nível de confiança da detecção (nominal/high/low).
      - name: frp
        data_type: DOUBLE
        description: Fire Radiative Power (MW).
        tests:
          - not_null
      - name: bright_ti4
        data_type: DOUBLE
        description: Temperatura de brilho canal TI4 (Kelvin).
      - name: daynight
        data_type: VARCHAR
        description: Detecção diurna (D) ou noturna (N).
      - name: geometry
        data_type: GEOMETRY
        description: POINT EPSG:4326.
        tests:
          - not_null
